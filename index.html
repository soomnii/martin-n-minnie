<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>Changhyun & Soomin | Coming Soon</title>
  <!-- Cross-platform web fonts: iPhone / Android / Desktop -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Noto+Sans+KR:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Italianno&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    ::root{
      --ivory:#fbfaf7;
      --gold:#ae8a22;
      --blue:#7fa8e6;
      --ink:#171717;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--ivory);
      color:var(--ink);
    }

    body{
      font-family:"Gowun Batang","Noto Sans KR",serif;
      display:flex;
      justify-content:center;
    }

    .page{
      position:relative;
      width:min(100%,480px);
      min-height:100svh;
      padding:48px 28px 54px;
      overflow:hidden;
      isolation:isolate;
    }

    .card{
      width:100%;
      text-align:center;
      padding:18px 8px;
    }

    .eyebrow{
      font-family:"Gowun Batang",serif;
      font-size:13px;
      letter-spacing:.1em;
      margin:0 0 34px;
      font-weight:800;
    }

    .names{
      color:#b08b2e !important;
      font-family:"Italianno", cursive;
      font-size:clamp(52px,15vw,70px);
      line-height:.88;
      margin:0;
      font-weight: 100;
    }

    .names .amp{
      display:block;
      color:#b08b2e !important;
      font-family:"Italianno", cursive;
      font-size:42px;
      line-height:1;
      margin:10px 0 6px;
    }

    .kr-names{
      margin-top:22px;
      font-family:"Gowun Batang", serif;
      letter-spacing:.22em;
      color:#4f78b8;
      font-size:17px;
      font-weight:400;
    }

    .photo-wrap{
      width:100%;
      margin:34px auto 32px;
    }

    .wedding-photo{
      display:block;
      width:100%;
      height:auto;
    }

    .divider{
      width:38px;
      height:1px;
      background:#CFC4AE;
      margin:0 auto 28px;
    }

    .coming{
      font-family:"Playfair Display",serif;
      letter-spacing:.14em;
      font-size:13px;
      margin-bottom:14px;
      font-weight:500;
    }

    .copy{
      margin:0 auto;
      max-width:310px;
      font-family:"Gowun Batang",sans-serif;
      color:#595652;
      font-size:13px;
      font-weight:300;
      line-height:1.9;
      word-break:keep-all;
    }

    .date{
      margin-top:34px;
      font-family:"Gowun Batang",serif;
      letter-spacing:.08em;
      font-size:13px;
    }

    .venue{
      margin-top:14px;
      font-family:"Gowun Batang",serif;
      font-size:12px;
      line-height:1.7;
      letter-spacing:.05em;
    }

    @media(max-width:360px){
      .page{padding-left:22px;padding-right:22px}
      .names{font-size:52px}
      .kr-names{font-size:16px}
      .copy{font-size:12px}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-label="모바일 청첩장 준비중 안내">

      <p class="eyebrow">THE MARRIAGE OF</p>

      <h1 class="names">
        Changhyun Lee
        <span class="amp">&amp;</span>
        Soomin Lee
      </h1>

      <div class="kr-names">이창현 · 이수민</div>

      <div class="photo-wrap">
        <img
          class="wedding-photo"
          src="./LSM_0028.jpg"
          alt="창현과 수민의 웨딩 청첩장과 부케"
        />
      </div>

      <div class="divider"></div>

      <div class="coming">OUR INVITATION IS COMING SOON</div>

      <p class="copy">
        저희의 소중한 날을 준비하고 있습니다.<br />
        곧 이곳에서 정식으로 인사드리겠습니다.
      </p>

      <div class="date">2026. 11. 22 SUN · 12:00 PM</div>

      <div class="venue">
        FOUR SEASONS HOTEL SEOUL<br />
        GRAND BALLROOM · 3F
      </div>

    </section>
  </main>
</body>

</html>
